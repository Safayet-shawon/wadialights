worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # compression for text payloads (the app also compresses; nginx covers cached responses)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

  # load balancing: least connections across the replicas, with passive failover
  upstream wadia_app {
    least_conn;
    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # shared edge cache for GET API responses and static files
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge:20m max_size=500m inactive=1h use_temp_path=off;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://wadia_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503;
      client_max_body_size 128k;

      # cache only what the app marks public (the product list); writes and the planner are no-store
      proxy_cache edge;
      proxy_cache_methods GET HEAD;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
      proxy_cache_lock on;
    }

    # the app serves the site with correct Cache-Control and byte ranges (needed for <video> seeking);
    # it is deliberately not cached here, because nginx would store partial (206) responses as whole files
    location / {
      proxy_pass http://wadia_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_request_buffering off;
    }
  }
}

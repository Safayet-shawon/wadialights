<!doctype html>
<html lang="en" class="is-ready" id="top">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafaf8" />
  <meta name="description" content="WADIA shop admin." />
  <title>Admin | WADIA</title>
  <link rel="canonical" href="https://wahdialights.vercel.app/admin" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:type" content="website" /><meta property="og:site_name" content="WADIA" />
  <meta property="og:title" content="Admin | WADIA" /><meta property="og:description" content="WADIA shop admin." />
  <meta property="og:url" content="https://wahdialights.vercel.app/admin" /><meta property="og:image" content="https://wahdialights.vercel.app/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="robots" content="noindex" />
  <script>try{var b=localStorage.getItem('wl-btn');document.documentElement.dataset.btn=/^(clay|glass|fabric|cut)$/.test(b)?b:'clay'}catch(e){document.documentElement.dataset.btn='clay'}</script>
  <script type="module" src="/src/pages/admin.js"></script>
</head>
<body class="page-inner">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="shell-header"></div>
  <main id="main" class="inner">

    <section class="wrap admin">
      <div id="login" class="login">
        <h1 class="page-title">Shop admin</h1>
        <form id="login-form" class="quote__form" novalidate>
          <label class="field"><span>Admin token</span><input id="token" type="password" autocomplete="current-password" required /></label>
          <div class="quote__actions"><button class="btn btn--solid" type="submit">Sign in</button><p class="form-msg" id="login-msg" role="status"></p></div>
        </form>
      </div>
      <div id="panel" hidden>
        <div class="adm-head"><h1 class="page-title">Shop admin</h1><button class="btn btn--sm" type="button" id="logout">Sign out</button></div>
        <div class="adm-tabs" role="tablist">
          <button role="tab" data-tab="orders" aria-selected="true">Orders</button>
          <button role="tab" data-tab="products" aria-selected="false">Products</button>
          <button role="tab" data-tab="inquiries" aria-selected="false">Enquiries</button>
        </div>
        <section class="adm-pane" id="tab-orders" role="tabpanel">
          <div class="adm-bar"><label class="select"><span class="sr-only">Filter by status</span><select id="order-filter"><option value="">All orders</option><option>received</option><option>confirmed</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></label><span id="orders-count"></span></div>
          <div id="orders-list"></div>
        </section>
        <section class="adm-pane" id="tab-products" role="tabpanel" hidden><div id="products-list"></div></section>
        <section class="adm-pane" id="tab-inquiries" role="tabpanel" hidden><div id="inq-list"></div></section>
      </div>
    </section>
  </main>
  <div id="shell-footer"></div>
</body>
</html>

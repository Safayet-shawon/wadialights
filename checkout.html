<!doctype html>
<html lang="en" class="is-ready" id="top">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafaf8" />
  <meta name="description" content="Place your WADIA order. Cash on delivery." />
  <title>Checkout | WADIA</title>
  <link rel="canonical" href="https://wahdialights.vercel.app/checkout" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:type" content="website" /><meta property="og:site_name" content="WADIA" />
  <meta property="og:title" content="Checkout | WADIA" /><meta property="og:description" content="Place your WADIA order. Cash on delivery." />
  <meta property="og:url" content="https://wahdialights.vercel.app/checkout" /><meta property="og:image" content="https://wahdialights.vercel.app/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="robots" content="noindex" />
  <script>try{var b=localStorage.getItem('wl-btn');document.documentElement.dataset.btn=/^(glow|clay|glass|fabric|cut)$/.test(b)?b:'glow'}catch(e){document.documentElement.dataset.btn='glow'}</script>
  <script type="module" src="/src/pages/checkout.js"></script>
</head>
<body class="page-inner">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="shell-header"></div>
  <main id="main" class="inner">

    <section class="wrap" id="checkout">
      <ol class="flow" aria-label="Order steps"><li class="is-done"><span>1</span>Cart</li><li aria-current="step"><span>2</span>Delivery details</li><li><span>3</span>Confirmation</li></ol>
      <h1 class="page-title">Checkout</h1>
      <div class="checkout__grid">
        <form id="checkout-form" class="quote__form" novalidate>
          <div id="checkout-errors" class="err-summary" role="alert" tabindex="-1" hidden></div>
          <h2>Delivery details</h2>
          <div class="field-row">
            <label class="field"><span>Full name</span><input name="name" autocomplete="name" maxlength="120" required /><small class="err" data-for="name"></small></label>
            <label class="field"><span>Phone</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="01XXXXXXXXX" required /><small class="err" data-for="phone"></small></label>
          </div>
          <label class="field"><span>Email (optional)</span><input name="email" type="email" autocomplete="email" maxlength="254" /><small class="err" data-for="email"></small></label>
          <label class="field"><span>Delivery address</span><textarea name="address" rows="3" maxlength="400" autocomplete="street-address" required></textarea><small class="err" data-for="address"></small></label>
          <div class="field-row">
            <label class="field"><span>Area</span><input name="area" maxlength="80" autocomplete="address-level3" placeholder="e.g. Mohakhali" /></label>
            <label class="field"><span>City</span><input name="city" maxlength="80" value="Dhaka" autocomplete="address-level2" required /><small class="err" data-for="city"></small></label>
          </div>
          <label class="field"><span>Note for us (optional)</span><textarea name="notes" rows="2" maxlength="1000"></textarea></label>
          <fieldset class="pay">
            <legend>Payment</legend>
            <label class="pay__opt"><input type="radio" name="payment" value="cod" checked /><span><b>Cash on delivery</b><small>Pay when your order arrives.</small></span></label>
            <label class="pay__opt"><input type="radio" name="payment" value="arrange" /><span><b>Arrange with the shop</b><small>We will call you to agree how you would like to pay.</small></span></label>
          </fieldset>
          <div class="quote__actions">
            <button class="btn btn--solid" type="submit" id="place-order">Place order</button>
            <p class="form-msg" id="checkout-msg" role="status"></p>
          </div>
        </form>
        <aside class="cart-sum" id="checkout-summary" aria-label="Order summary"></aside>
      </div>
    </section>
  </main>
  <div id="shell-footer"></div>
</body>
</html>
